<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cruisr · cockpit Diagnostic v01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{
  --ink:#141820; --panel:#1b2129; --panel2:#222a34; --line:#2e3742;
  --text:#ece7dd; --muted:#8e97a3; --dim:#5f6873;
  --amber:#e2a75c; --amber-dim:#8a6432; --green:#7fb98a; --red:#d97b6c;
  --serif:'Fraunces',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.app{display:grid;grid-template-columns:230px 1fr 320px;grid-template-rows:56px 1fr;height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:20px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-family:var(--serif);font-weight:400;font-size:20px;margin:0;letter-spacing:.01em}
header h1 em{color:var(--amber);font-style:italic}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.spacer{flex:1}
.clock{font-family:var(--mono);font-size:22px;letter-spacing:.04em;display:flex;align-items:center;gap:12px}
.langbtn{padding:6px 12px;border:1px solid var(--amber-dim);border-radius:6px;font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.08em}
.langbtn:hover{border-color:var(--amber)}
.clock button{padding:6px 12px;border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.clock button:hover{border-color:var(--amber);color:var(--text)}
.clock .over{color:var(--red)}

nav{border-right:1px solid var(--line);padding:16px 0;overflow:auto;display:flex;flex-direction:column}
.nav-title{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);padding:0 20px 8px}
.phase{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:9px 20px;text-align:left;position:relative;color:var(--muted);width:100%}
.phase .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);position:relative;z-index:1}
.phase::before{content:'';position:absolute;left:23px;top:0;bottom:0;width:1px;background:var(--line)}
.phase:first-of-type::before{top:50%}
.phase.last::before{bottom:50%}
.phase .name{font-size:14px}
.phase .t{font-family:var(--mono);font-size:11px;color:var(--dim)}
.phase:hover{color:var(--text)}
.phase.active{color:var(--text);background:var(--panel)}
.phase.active .dot{background:var(--amber);box-shadow:0 0 0 4px rgba(226,167,92,.18)}
.phase.done .dot{background:var(--green)}
.pins{margin-top:auto;padding:16px 0 0;border-top:1px solid var(--line)}
.pin{display:block;width:100%;text-align:left;padding:8px 20px;color:var(--muted);font-size:14px}
.pin:hover,.pin.active{color:var(--amber)}
.warn{margin:16px 20px 0;padding:12px;border:1px solid var(--amber-dim);border-radius:8px;font-size:12.5px;color:var(--muted);line-height:1.45}
.warn b{color:var(--amber);font-weight:500}

main{overflow:auto;padding:28px 40px 60px;scroll-behavior:smooth}
.eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--amber);margin-bottom:6px}
h2{font-family:var(--serif);font-weight:400;font-size:34px;margin:0 0 6px;line-height:1.1}
.goal{color:var(--muted);font-size:15px;margin:0 0 26px;max-width:62ch}
.goal b{color:var(--text);font-weight:500}

.say{border-left:3px solid var(--amber);padding:12px 18px;margin:14px 0;background:var(--panel);border-radius:0 8px 8px 0;font-family:var(--serif);font-size:18px;line-height:1.45;max-width:70ch}
.say .lbl{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--amber);margin-bottom:6px}
.note{color:var(--muted);font-size:14px;margin:8px 0 18px;max-width:66ch}
.note b{color:var(--text);font-weight:500}
h3{font-family:var(--sans);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}

.qs{list-style:none;margin:0;padding:0;max-width:70ch}
.qs li{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.qs li .box{width:18px;height:18px;border:1.5px solid var(--dim);border-radius:4px;margin-top:3px;cursor:pointer;flex:none}
.qs li.on .box{background:var(--green);border-color:var(--green)}
.qs li.on .q{color:var(--dim);text-decoration:line-through}
.qs .q{font-size:16px;line-height:1.45}
.qs .q .why{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.qs .q .key{color:var(--amber);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin-right:8px}

.check{margin:22px 0;padding:14px 18px;border:1px dashed var(--amber-dim);border-radius:8px;max-width:70ch}
.check .lbl{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--amber);display:block;margin-bottom:4px}
.check p{margin:0;font-family:var(--serif);font-size:17px}

.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:12px 0 8px}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column}
.plan h4{font-family:var(--serif);font-weight:400;font-size:24px;margin:0}
.plan .tag{font-family:var(--mono);font-size:11px;color:var(--muted);margin:2px 0 12px}
.plan ul{margin:0;padding:0;list-style:none;font-size:14px}
.plan li{padding:6px 0;border-top:1px solid var(--line)}
.plan li.hi{color:var(--amber)}
.plan .contrast{margin-top:auto;padding-top:12px;font-size:13px;color:var(--muted);border-top:1px solid var(--amber-dim)}
.plan .contrast b{color:var(--text);font-weight:500}
.plan.rec{border-color:var(--amber)}
.ptabs{display:flex;gap:6px;margin:14px 0 10px}
.ptab{padding:9px 16px;border:1px solid var(--line);border-radius:8px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.ptab .n{font-family:var(--serif);font-size:19px;color:var(--text)}
.ptab .p{font-family:var(--mono);font-size:11px}
.ptab:hover{border-color:var(--amber-dim)}
.ptab.active{border-color:var(--amber);background:var(--panel)}
.ptab.active .p{color:var(--amber)}
.pintro{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 14px;max-width:90ch}
.pintro>div{background:var(--panel);border-radius:8px;padding:12px 16px;font-size:14px}
.pintro .lbl{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--amber);display:block;margin-bottom:4px}
.pintro .s{font-family:var(--serif);font-size:16.5px;line-height:1.4}
.items{max-width:90ch}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:last-child{border-bottom:1px solid var(--line)}
.item .head{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start;cursor:pointer;width:100%;text-align:left;padding:2px 0}
.item .w{display:flex;gap:3px;margin-top:8px}
.item .w i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.item .w i.on{background:var(--amber)}
.item .w.w3 i.on{background:var(--amber)}
.item .name{font-size:15.5px;line-height:1.4}
.item .name .site{display:block;font-size:12px;color:var(--dim);margin-top:1px}
.item .arrow{font-family:var(--mono);color:var(--dim);font-size:12px;margin-top:4px}
.item .body{display:none;grid-template-columns:44px 1fr;gap:14px;margin-top:8px}
.item.open .body{display:grid}
.item.open .arrow{color:var(--amber)}
.item .body .say{margin:6px 0 10px;font-size:17px}
.item .body .deep{font-size:14px;color:var(--muted);max-width:68ch}
.item .body .deep b{color:var(--text);font-weight:500}
.item .body .deep .gt{display:block;margin-top:8px;padding:8px 12px;border-left:2px solid var(--green);color:var(--text)}
.item .body .deep .gt::before{content:'Exemple · ';font-family:var(--mono);font-size:10.5px;color:var(--green);letter-spacing:.1em;text-transform:uppercase}
.contrastbox{margin:16px 0 0;padding:14px 18px;border:1px solid var(--amber-dim);border-radius:8px;max-width:90ch;background:var(--panel)}
.contrastbox .lbl{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--amber);display:block;margin-bottom:6px}
.contrastbox .s{font-family:var(--serif);font-size:17px;line-height:1.45}
.legend{font-family:var(--mono);font-size:11px;color:var(--dim);margin:6px 0 0}
details{margin:8px 0;max-width:72ch}
summary{cursor:pointer;color:var(--amber);font-size:14px;padding:6px 0;list-style:none}
summary::before{content:'+ ';font-family:var(--mono)}
details[open] summary::before{content:'– '}

table{border-collapse:collapse;width:100%;max-width:80ch;font-size:14.5px}
td,th{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:400}
td:first-child{color:var(--muted);width:38%}
td:last-child{font-family:var(--serif);font-size:16px}

.branch{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:12px 0}
.branch div{background:var(--panel);border-radius:8px;padding:14px;font-size:14px}
.branch .if{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.branch .then{font-family:var(--serif);font-size:18px;color:var(--amber)}

aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
aside .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
aside h5{margin:0;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
aside .copy{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:4px 9px}
aside .copy:hover{color:var(--amber);border-color:var(--amber)}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field textarea{background:var(--ink);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:7px 9px;font-family:var(--mono);font-size:13px;width:100%;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--amber);outline:none}
.field.filled input,.field.filled textarea{border-color:var(--amber-dim)}
.sep{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:10px 0 2px}

.toast{position:fixed;bottom:22px;right:340px;background:var(--amber);color:var(--ink);padding:8px 14px;border-radius:6px;font-family:var(--mono);font-size:12px;opacity:0;transform:translateY(6px);transition:.2s}
.toast.show{opacity:1;transform:none}
.kbd{font-family:var(--mono);font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:1100px){.app{grid-template-columns:200px 1fr 280px}.plans{grid-template-columns:1fr}}

/* v2 additions */
.tools{display:flex;gap:6px}
.tools button{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:4px 9px}
.tools button:hover{color:var(--amber);border-color:var(--amber)}
.tools button.danger:hover{color:var(--red);border-color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(640px,90vw)}
.mt{font-family:var(--serif);font-size:20px;margin-bottom:10px}
.mbox textarea{width:100%;min-height:200px;background:var(--ink);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:10px;font-family:var(--mono);font-size:12.5px}
.mb{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.mb button{font-family:var(--mono);font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.mb .mok{background:var(--amber);color:var(--ink);border-color:var(--amber)}
aside .top{flex-wrap:wrap;gap:6px}

.tpl{margin:12px 0;padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:72ch;position:relative}
.tpl .lbl{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--amber);display:block;margin-bottom:6px}
.tpl pre{margin:0;white-space:pre-wrap;font-family:var(--sans);font-size:14.5px;line-height:1.5;color:var(--text)}
.tpl .cp{position:absolute;top:10px;right:12px;font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:3px 8px}
.tpl .cp:hover{color:var(--amber);border-color:var(--amber)}
.cap{margin:14px 0;padding:10px 14px;border-left:3px solid var(--green);background:var(--panel);border-radius:0 8px 8px 0;max-width:72ch;font-size:14px;color:var(--muted)}
.cap .lbl{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--green);margin-bottom:4px}
.cap b{color:var(--text);font-weight:500}
.app{grid-template-columns:230px 1fr 360px}
.modes{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.modes button{padding:6px 14px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.modes button.active{background:var(--amber);color:var(--ink)}
.rec{margin:0 0 20px;padding:14px 18px;border:1px solid var(--green);border-radius:8px;background:var(--panel);max-width:90ch;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.rec .badge{font-family:var(--serif);font-size:26px;color:var(--green);white-space:nowrap}
.rec .why{font-size:13.5px;color:var(--muted)}
.rec .why b{color:var(--text);font-weight:500}
.calque{border-left:3px solid var(--green);padding:10px 16px;margin:10px 0;background:var(--panel);border-radius:0 8px 8px 0;max-width:72ch}
.calque .lbl{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--green);margin-bottom:4px}
.calque .lbl .inf{color:var(--red);margin-left:8px}
.calque .s{font-family:var(--serif);font-size:16.5px;line-height:1.45}
.calque .q{font-size:15px;margin:4px 0}
.calque .q::before{content:'? ';color:var(--green);font-family:var(--mono)}
.calques-h{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--green);margin:26px 0 6px}
aside .sel{display:flex;flex-direction:column;gap:3px}
aside .sel label{font-size:12px;color:var(--muted)}
aside select{background:var(--ink);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:6px 8px;font-family:var(--mono);font-size:12.5px;width:100%}
aside select.set{border-color:var(--green)}
.flags{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin:4px 0}
.flag{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer;padding:4px 6px;border:1px solid var(--line);border-radius:6px}
.flag.on{color:var(--text);border-color:var(--green)}
.flag i{width:10px;height:10px;border-radius:2px;background:var(--line);flex:none}
.flag.on i{background:var(--green)}
.recmini{margin:8px 0 4px;padding:10px 12px;border:1px solid var(--green);border-radius:8px;font-size:13px}
.recmini b{font-family:var(--serif);font-size:20px;color:var(--green);display:block;font-weight:400}
.pal{font-family:var(--mono);font-size:11px;color:var(--amber);margin-top:4px}
.gt.ov::before{content:attr(data-l) ' · '!important}
.gt.inf{border-left-color:var(--amber-dim)}
.warnbar{font-family:var(--mono);font-size:11px;color:var(--dim);padding:6px 20px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Cruisr · <em id="hTitle">Diagnostic</em> <span class="meta">v01</span></h1>
  <span class="meta">Hugo / Greg · 45 min · puis Proposition 30 min</span>
  <span class="spacer"></span>
  <span class="meta"><span class="kbd">←</span> <span class="kbd">→</span> phases &nbsp; <span class="kbd">F</span> forfaits &nbsp; <span class="kbd">P</span> proposition &nbsp; <span class="kbd">O</span> objections</span>
    <div class="clock"><span id="clock">00:00</span><button id="clockBtn">démarrer</button></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<aside>
  <div class="top"><h5 id="capT">Profil · capture</h5><div class="tools"><button id="pasteBtn">coller le brief</button><button class="copy" id="copyBtn">copier le debrief</button><button id="newBtn" class="danger">nouveau</button></div></div>
  <div class="tools" style="margin:2px 0 8px"><button id="noteBtn">+ note de modif</button><button id="notesCopy">copier les notes</button><button id="notesClear" class="danger">effacer</button></div>
  <div id="recmini"></div>
  <div id="fields"></div>
</aside>
</div>
<div class="toast" id="toast">Copié</div>
<script>
// ---------- DATA (v1) ----------
const L=x=>x;
const TOOL='diagnostic';
const tpl=(l,t)=>({type:'tpl',l,t});
const cap=t=>({type:'cap',t});
const say = (t,l='Dire')=>({type:'say',t,l});
const note = t=>({type:'note',t});
const qs = (items)=>({type:'qs',items});
const check = t=>({type:'check',t});
const h3 = t=>({type:'h3',t});
const html = (t)=>({type:'html',t});


const phases = [
 {id:'brief',name:'Brief',t:'2 min',title:'Lire le brief, régler le profil',goal:'Deux minutes avant d\'entrer. Ce que Sabrina a capturé se colle à droite. Ce qu\'elle n\'a pas eu, tu le confirmes en phase 2-3 — tu ne le redemandes pas.',blocks:[
  qs([
   {q:'« Coller le brief » (en haut à droite) avec le brief Fit Call copié dans ClickUp — menus, drapeaux et champs se remplissent',key:'du brief SDR'},
   {q:'Compléter ce que le parseur n\'a pas pris : maturité finance (déduite de « chiffres reçus quand »), trajectoire si connue'},
   {q:'Relire le pain dans ses mots — c\'est ce que tu reformules en phase 4'},
   {q:'Lire les calques actifs dans Ouverture et Forfaits — un hook, deux questions, les items qui montent'},
   {q:'Vérifier le forfait recommandé et l\'ancrage prix — tu les nommes en phase 7, pas avant'},
  ]),
  note('<b>Pas vendre.</b> Trois livrables : il nomme son pain lui-même · paramètres complets pour chiffrer · Proposition bookée en personne sous 48h avec un devoir.'),
 ]},
 {id:'ouverture',name:'Ouverture',t:'2 min',title:'Cadrer',goal:'Il sait à quoi s\'attendre. Pas de surprise sur le fait qu\'on ne donne pas de prix aujourd\'hui.',blocks:[
  say('Merci de me recevoir. Le but aujourd\'hui c\'est simple : comprendre comment ta business roule, puis te montrer à haut niveau ce qu\'on fait. Si ça fait du sens, on se revoit avec un prix précis. Ça te va ?'),
 ]},
 {id:'business',name:'La business',t:'8 min',title:'Lui, pas moi',goal:'Il parle. Je note. La question 3-5 ans ouvre tout.',blocks:[
  qs([
   {q:'Raconte-moi la business. Depuis le début, comment ça a évolué ?'},
   {q:'Vous êtes combien dans l\'équipe, incluant toi ?'},
   {q:'Grosso modo, revenus annuels ?',why:'Si hésitation : « 500 ? 1M ? Plus ? Juste pour que je calibre. »'},
   {q:'Si on se projette dans 3-5 ans, où est-ce que tu veux être avec cette compagnie-là ? Encore propriétaire ? Vendue ? Plus grosse ?',key:'la question d\'or',why:'Puis je me tais.'},
   {q:'Est-ce que doubler ça t\'intéresse, ou t\'es plus dans stabilité, moins de charge sur toi ?',why:'Selon sa réponse.'},
  ]),
  note('Écouter pour : ce qui le fatigue · ce qu\'il fait lui-même qu\'il ne devrait pas · l\'inventaire qui dort · les chiffres qu\'il n\'a pas.'),
 ]},
 {id:'finance',name:'La finance',t:'6 min',title:'La structure actuelle',goal:'Tout ce qu\'il faut pour chiffrer. Cocher au fur et à mesure.',blocks:[
  qs([
   {q:'Qui fait la tenue de livres en ce moment ?'},

// ---------- RECOMMANDATION ----------
// Règle (une ligne à ajuster avec Hugo) :
function recommend(){
 const nf=Object.values(flagOn).filter(Boolean).length;
 const p=profile;const why=[];
 if(p.maturite==='m3'){why.push('<b>Maturité 3</b> — contrôleur interne. On vend l\'optimisation de la première ligne, pas la structure.');return {plan:'Books',why,nf};}
 const cfoOK=p.ca&&p.ca!=='lt1';
 const grow=p.traj==='croitre'||p.traj==='sortir';
 if(nf>=3&&grow&&cfoOK){why.push(`<b>${nf} drapeaux</b> + trajectoire <b>${dims.find(d=>d.id==='traj').opts[p.traj]}</b> + revenus ≥ 1M.`);return {plan:'CFO',why,nf};}
 if(nf>=3&&grow&&!cfoOK){why.push(`<b>${nf} drapeaux</b> + croissance/sortie, mais revenus < 1M : Controller + séances CFO à 500 $.`);return {plan:'Controller + séances CFO',why,nf};}
 why.push(nf?`<b>${nf} drapeau${nf>1?'x':''}</b> coché${nf>1?'s':''}.`:'Aucun drapeau coché encore.');
 if(p.traj)why.push(`Trajectoire : ${dims.find(d=>d.id==='traj').opts[p.traj]}.`);
 if(!p.ca)why.push('Revenus non renseignés — éligibilité CFO inconnue.');
 return {plan:'Controller',why,nf};
}
function anchor(){const a={lt1:'ta commis',b1:'ta commis',b2:'un contrôleur (80-90K)',b3:'une équipe finance'}[profile.ca];return a?`Ancrage prix : <b>${a}</b>`:'';}
function palier(){const o=overlays.ca[profile.ca];return o&&o.pal?o.pal:'';}

// ---------- CALQUES ACTIFS ----------
function activeOverlays(){const out=[];for(const d of dims){const v=profile[d.id];if(v&&overlays[d.id]&&overlays[d.id][v])out.push({dim:d.l,key:d.id,val:d.opts[v],o:overlays[d.id][v]});}return out;}
function itemWeight(id,base){let w=base;for(const a of activeOverlays()){if(a.o.w&&a.o.w[id])w=Math.max(w,a.o.w[id]);}for(const f of flags){if(flagOn[f[0]]&&flagOverlays[f[0]].w[id])w=Math.max(w,flagOverlays[f[0]].w[id]);}return w;}
function itemExtras(id){let h='';for(const a of activeOverlays()){if(a.o.ex&&a.o.ex[id])h+=`<span class="gt ov ${a.o.inf?'inf':''}" data-l="${a.val}${a.o.inf?' · inféré':''}">${a.o.ex[id]}</span>`;}for(const f of flags){if(flagOn[f[0]]&&flagOverlays[f[0]].ex[id])h+=`<span class="gt ov" data-l="${f[1]}">${flagOverlays[f[0]].ex[id]}</span>`;}return h;}
function calqueBlocks(phaseId){
 let h='';const acts=activeOverlays();
 const map={ouverture:'hook',business:'q',finance:'q',positionner:'close',close:'close'};
 const kind=map[phaseId];if(!kind)return '';
 for(const a of acts){
  const o=a.o;const inf=o.inf?'<span class="inf">inféré</span>':'';
  if(kind==='hook'&&o.hook)h+=`<div class="calque"><span class="lbl">${a.dim} · ${a.val}${inf}</span><div class="s">${o.hook}</div></div>`;
  if(kind==='q'){const qs=(o.q||[]).filter(x=>x[0]===phaseId);if(qs.length)h+=`<div class="calque"><span class="lbl">${a.dim} · ${a.val}${inf}</span>${qs.map(x=>`<div class="q">${x[1]}</div>`).join('')}</div>`;}
  if(kind==='close'&&o.close)h+=`<div class="calque"><span class="lbl">${a.dim} · ${a.val}${inf}</span><div class="s">${o.close}</div></div>`;
 }
 if(phaseId==='ouverture'&&palier())h+=`<div class="calque"><span class="lbl">Revenus · palier</span><div class="s" style="font-family:var(--mono);font-size:13px">${palier()}</div></div>`;
 return h?`<div class="calques-h">Calques actifs</div>${h}`:'';
}
function objectionRows(){let h='';for(const a of activeOverlays()){for(const ob of (a.o.obj||[]))h+=`<tr><td>${ob[0]}<br><span style="font-family:var(--mono);font-size:10.5px;color:var(--green)">${a.val}${a.o.inf?' · inféré':''}</span></td><td>${ob[1]}</td></tr>`;}return h;}
function recBox(){const r=recommend();return `<div class="rec"><div class="badge">${r.plan}</div><div class="why">${r.why.join(' ')} ${anchor()}${palier()?`<div class="pal">${palier()}</div>`:''}</div></div>`;}

const nav=document.getElementById('nav'),main=document.getElementById('main'),fEl=document.getElementById('fields');
let cur=0, currentPin=null; const done=new Set(); const ticks={};

function renderNav(){

 let h=`<div class="nav-title">${L('Déroulé · 45 min')}</div>`;
 ph.forEach((p,i)=>{h+=`<button class="phase ${i===cur&&!currentPin?'active':''} ${done.has(p.id)?'done':''} ${i===ph.length-1?'last':''}" data-i="${i}"><span class="dot"></span><span class="name">${L(p.name)}</span><span class="t">${L(p.t)}</span></button>`});
 h+=`<div class="pins"><div class="nav-title">${L('Toujours à portée')}</div>`;
 for(const k in pins){h+=`<button class="pin ${currentPin===k?'active':''}" data-pin="${k}">${L(pins[k].title)}</button>`}
 h+=`</div><div class="warn">${L('<b>Ne pas</b> dire « les petites » · présenter les prix du site comme finaux · parler du site web · monologuer 2 min sans check-in.')}</div>`;
 h+=`<div class="warnbar">${Object.keys(profile).filter(k=>profile[k]).length} dimensions · ${Object.values(flagOn).filter(Boolean).length} drapeaux</div>`;

 nav.querySelectorAll('.phase').forEach(b=>b.onclick=()=>go(+b.dataset.i));
 nav.querySelectorAll('.pin').forEach(b=>b.onclick=()=>showPin(b.dataset.pin));
}
function block(b,ctx){
 switch(b.type){
  case 'say':return `<div class="say"><span class="lbl">${L(b.l)}</span>${L(b.t)}</div>`;
  case 'note':return `<p class="note">${L(b.t)}</p>`;
  case 'h3':return `<h3>${L(b.t)}</h3>`;
  case 'check':return `<div class="check"><span class="lbl">Check-in</span><p>${L('« '+b.t+' »')}</p></div>`;
  case 'html':return b.t;
  case 'tpl':{const tx=fill(b.t);return `<div class="tpl"><span class="lbl">${b.l}</span><button class="cp" data-t="${encodeURIComponent(tx)}">copier</button><pre>${tx}</pre></div>`;}
  case 'cap':return `<div class="cap">${b.t}</div>`;
  case 'plans':return renderPlans();
  case 'qs':return `<ul class="qs">${b.items.map((it,j)=>{const k=ctx+'-'+j;return `<li class="${ticks[k]?'on':''}" data-k="${k}"><span class="box"></span><span class="q">${it.key?`<span class="key">${L(it.key)}</span>`:''}${L(it.q)}${it.why?`<span class="why">${L(it.why)}</span>`:''}</span></li>`}).join('')}</ul>`;
 }
}
function renderMain(p,ctx,eyebrow,phaseId){
 let h=`<div class="eyebrow">${eyebrow}</div><h2>${L(p.title)}</h2><p class="goal">${L(p.goal)}</p>`;
 if(phaseId==='positionner'||phaseId==='forfaits')h+=recBox();
 h+=p.blocks.map((b,i)=>block(b,ctx+i)).join('');
 if(phaseId)h+=calqueBlocks(phaseId);
 if(ctx==='pin-objections'){const rows=objectionRows();if(rows)h+=`<div class="calques-h">Objections des calques actifs</div><table><tr><th>Il dit</th><th>Je réponds</th></tr>${rows}</table>`;}
 main.innerHTML=h;main.scrollTop=0;
 main.querySelectorAll('.qs li').forEach(li=>li.onclick=()=>{ticks[li.dataset.k]=!ticks[li.dataset.k];li.classList.toggle('on')});
 main.querySelectorAll('.tpl .cp').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(decodeURIComponent(b.dataset.t)).then(()=>toastMsg('Copié'))});
 bindPlans();
}
function go(i){currentPin=null;const ph=curPhases();cur=Math.max(0,Math.min(ph.length-1,i));if(cur>0)done.add(ph[cur-1].id);renderNav();const p=ph[cur];renderMain(p,p.id,`${cur} / ${ph.length-1} · ${L(p.t)}`,p.id);}
function showPin(k){currentPin=k;renderNav();renderMain(pins[k],'pin-'+k,L('Épinglé'));}

let curPlan=1; const openItems={};
function renderPlans(){
 const P=plans[curPlan];const r=recommend();
 return `<div class="ptabs">${plans.map((p,i)=>`<button class="ptab ${i===curPlan?'active':''}" data-p="${i}"><span class="n">${p.name}${r.plan.startsWith(p.name)?' ✓':''}</span><span class="p">${L(p.price)}</span></button>`).join('')}</div>
 <div class="pintro"><div><span class="lbl">${L('En une phrase')}</span><div class="s">${L(P.one)}</div></div><div><span class="lbl">${L('Pour qui')}</span>${L(P.who)}</div></div>
 <div class="legend">● ● ● poids — base + calques actifs · clic sur une ligne = quoi dire + profondeur</div>
 <div class="items">${P.items.map((it,j)=>{const k=P.id+j;const w=itemWeight(it.id,it.w);return `<div class="item ${openItems[k]?'open':''}" data-k="${k}"><button class="head"><span class="w w${w}">${[1,2,3].map(x=>`<i class="${x<=w?'on':''}"></i>`).join('')}</span><span class="name">${L(it.n)}${w>it.w?' <span style="color:var(--green);font-family:var(--mono);font-size:10px">↑ calque</span>':''}</span><span class="arrow">${openItems[k]?L('fermer'):L('ouvrir')}</span></button><div class="body"><span></span><div><div class="say"><span class="lbl">${L('Dire')}</span>${L(it.say)}</div><div class="deep">${L(it.deep)}${itemExtras(it.id)}</div></div></div></div>`}).join('')}</div>
 <div class="contrastbox"><span class="lbl">${L(P.contrast.lbl)}</span><div class="s">${L(P.contrast.s)}</div></div>`;
}
function bindPlans(){

cb.onclick=()=>{if(tick){clearInterval(tick);tick=null;cb.dataset.s='reprendre';cb.textContent=L('reprendre');return}start=start??Date.now();const base=start;const limit=45;tick=setInterval(()=>{const s=Math.floor((Date.now()-base)/1000);clk.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');clk.classList.toggle('over',s>limit*60)},500);cb.dataset.s='pause';cb.textContent=L('pause')};
// keys
document.addEventListener('keydown',e=>{const tag=e.target.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);if(e.key==='c'||e.key==='C')go(5);if(e.key==='f'||e.key==='F')go(6);if(e.key==='p'||e.key==='P')go(phases.length-1);if(e.key==='o'||e.key==='O')showPin('objections');});

// ---------- PERSISTANCE · BRIEF · NOTES (partagé) ----------
const STORE_KEY=(typeof TOOL!=='undefined'?TOOL:'cruisr')+'_state_v1';
const NOTES_KEY=(typeof TOOL!=='undefined'?TOOL:'cruisr')+'_notes_v1';
function collectState(){saveVals();return {profile,flagOn,seqv:(typeof seqv!=='undefined'?seqv:{}),vals,ts:Date.now()};}
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(collectState()))}catch(e){}}
function restore(){try{const s=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(!s)return false;Object.assign(profile,s.profile||{});Object.assign(flagOn,s.flagOn||{});if(typeof seqv!=='undefined')Object.assign(seqv,s.seqv||{});Object.assign(vals,s.vals||{});return true}catch(e){return false}}
function resetAll(){if(!confirm('Vider le prospect ? (les notes de modif restent)'))return;for(const k in profile)delete profile[k];for(const k in flagOn)delete flagOn[k];if(typeof seqv!=='undefined')for(const k in seqv)delete seqv[k];for(const k in vals)delete vals[k];fEl.querySelectorAll('input,textarea').forEach(e=>e.value='');persist();renderFields();if(typeof renderRec==='function')renderRec();if(typeof renderRecMini==='function')renderRecMini();if(typeof refresh==='function')refresh();else render();}
setInterval(persist,3000);window.addEventListener('beforeunload',persist);

// Coller le brief → profil
function norm(x){return (x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function parseBrief(txt){
 const n=norm(txt);let hits=0;
 for(const d of dims){for(const [k,v] of Object.entries(d.opts)){const nv=norm(v.split(' — ')[0].split(' (')[0]);if(nv.length>3&&n.includes(nv)){profile[d.id]=k;hits++;break;}}}
 for(const f of flags){if(n.includes(norm(f[1])))flagOn[f[0]]=true;}
 if(/lien affectif\s*:\s*oui/i.test(txt))flagOn.lien=true;
 const line=(label)=>{const m=txt.match(new RegExp('^'+label+'\\s*:\\s*(.+)$','im'));return m?m[1].trim():null;};
 const first=txt.split('\n')[0]||'';const mm=first.match(/—\s*(.+?)\s*—/);if(mm)vals.entreprise=mm[1].trim();
 const map={'Pain \\(ses mots\\)':'pain','Contact':'contact','Chiffres re[cç]us quand':'delai','Objection entendue':'obj','Notes':'notes','Prochaine action':'prochaine','R[ée]ception':'recep','Vision':'vision'};
 const dg=line('Diagnostic');if(dg&&dg!=='—'&&fields.some(f=>f[0]==='notes'))vals.notes=((vals.notes||'')+' Diagnostic (Fit Call) : '+dg).trim();
 for(const [lab,id] of Object.entries(map)){const v=line(lab);if(v&&v!=='—'&&fields.some(f=>f[0]===id))vals[id]=v;}
 const liv=line('Livres');if(liv){const parts=liv.split('·');if(parts.length>2&&fields.some(f=>f[0]==='livres_d'))vals.livres_d=parts.slice(2).join('·').trim();}
 const emp=txt.match(/Employ[ée]s\s+([^·\n]+)/i);if(emp&&fields.some(f=>f[0]==='emp'))vals.emp=emp[1].trim();
 return hits;
}
function modal(title,placeholder,onok,okLabel){
 const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="mbox"><div class="mt">${title}</div><textarea placeholder="${placeholder}"></textarea><div class="mb"><button class="mcancel">annuler</button><button class="mok">${okLabel||'appliquer'}</button></div></div>`;
 document.body.appendChild(m);const ta=m.querySelector('textarea');ta.focus();
 m.querySelector('.mcancel').onclick=()=>m.remove();m.querySelector('.mok').onclick=()=>{onok(ta.value);m.remove();};
 m.onclick=e=>{if(e.target===m)m.remove()};
}
function pasteBrief(){modal('Coller le brief (ClickUp)','Coller ici le brief SDR ou le debrief Diagnostic…',txt=>{const h=parseBrief(txt);persist();renderFields();if(typeof renderRec==='function')renderRec();if(typeof renderRecMini==='function')renderRecMini();if(typeof refresh==='function')refresh();else render();toastMsg(h+' dimensions réglées');});}
function loadNotes(){try{return JSON.parse(localStorage.getItem(NOTES_KEY)||'[]')}catch(e){return []}}
function addNote(){modal('Note de modif — ce qui ne marche pas, ce qui manque','Ex. : Hook 1,5-6M — trop long, les gens coupent après « trimestriel ». Situation : Boîte vocale.',txt=>{if(!txt.trim())return;const nts=loadNotes();nts.push({t:txt.trim(),d:new Date().toISOString().slice(0,16).replace('T',' '),where:document.querySelector('h2')?.textContent||''});localStorage.setItem(NOTES_KEY,JSON.stringify(nts));toastMsg('Note ajoutée ('+nts.length+')');},'ajouter');}
function copyNotes(){const nts=loadNotes();if(!nts.length){toastMsg('Aucune note');return}navigator.clipboard.writeText('Notes de modif — '+(typeof TOOL!=='undefined'?TOOL:'')+'\n\n'+nts.map(n=>`[${n.d}] ${n.where}\n${n.t}`).join('\n\n')).then(()=>toastMsg(nts.length+' notes copiées'));}
function clearNotes(){if(confirm('Effacer les notes de modif ?')){localStorage.removeItem(NOTES_KEY);toastMsg('Notes effacées')}}
function toastMsg(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>{t.classList.remove('show');t.textContent='Copié'},1600)}
// prénom pour les gabarits
function prenom(){const c=(vals.contact||'').trim();return c?c.split(/\s+/)[0]:'[prénom]';}
function fill(s){saveVals();return s.replace(/\[prénom\]/g,prenom()).replace(/\[Entreprise\]/g,vals.entreprise||'[Entreprise]').replace(/\[entreprise\]/g,vals.entreprise||'[entreprise]').replace(/\[date rdv\]/g,vals.rdv||'[date rdv]').replace(/\[devoir\]/g,vals.devoir||'[devoir]').replace(/\[pain\]/g,vals.pain||'[pain]');}

restore();renderFields();renderRecMini();setMode('diag');
document.getElementById('pasteBtn').onclick=pasteBrief;document.getElementById('newBtn').onclick=resetAll;document.getElementById('noteBtn').onclick=addNote;document.getElementById('notesCopy').onclick=copyNotes;document.getElementById('notesClear').onclick=clearNotes;
</script>
</body>
